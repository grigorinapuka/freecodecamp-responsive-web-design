<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Business Card</title>
  <link rel="stylesheet" href="styles.css"></link>
</head>

<body>
 <div class="business-card">
  <img class="profile-image" src="Inside the .business-card element, there should be an img element with a class attribute with a value of profile-image." alt="Profile Image">
  <p class="full-name">Ameli Smith</p>
  <p class="designation">Manager</p>
  <p class="company">Amazon</p>
  <hr>
  <p>ameli@gmail.com</p>
  <p>+447456378976</p>
  <a class="portfolio-link" href="https://example.com">Portfolio</a>
  <hr>
  <div class="social-media">
    <h2>Connect with me</h2>
    <a href="https://x.com/$0">Twitter</a>
    <a href="https://www.linkedIn.com">LinkedIn</a>
    <a href="https://www.github.com">GitHub</a>
  </div>
 </div>
</body>

</html>
