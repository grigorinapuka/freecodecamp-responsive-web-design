<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
  <h1>Checkout</h1>
  <section>
    <h2>Your Cart</h2>
    <img src="https://cdn.prod.website-files.com/6581a6450c039a3a1dad10c3/67065ac8c7a3bda713a1ce13_659822202cdb5387501fc96d_Basket%2520app.webp$0" alt="Example of an online shopping app cart">
  </section>

  <section>
    <h2>Payment Information</h2>
    <form>
        <input type="text" name="card-name" id="card-name" required>
        <label for="card-name">Card Name <span aria-hidden="true">*</label>

        <input type="text" name="card-number" id="card-number" aria-describedby= "card-number-help" required>
        <p id="card-number-help">Please fill in all the information</p>
        <label for="card-number">Card Number <span aria-hidden="true">*</label>
        
    </form>
  </section>
</body>

</html>
