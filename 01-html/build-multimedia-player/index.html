<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>Multimedia Player</h1>
  <section>
    <h2>Now Playing: BTS - 21st Century Girls</h2>
    <audio controls aria-label="song">
      <source src="21st-century-girl.mp3" type="audio/mpeg">
    </audio>
  </section>

  <section>
    <h2>BTS - Swim</h2>
    <video controls width=250>
      <source src="my-video.mp4" type="video/mp4">
      <track src="subtitles-en.vtt" kind="subtitles" srclang="en" label="english">
  </section>

  <section>
    <h2>Transcript</h2>
    <p>This page is dediced to the most famous boy band group!</p>
  </section>

</body>

</html>
