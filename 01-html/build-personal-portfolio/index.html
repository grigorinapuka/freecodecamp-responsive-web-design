<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Requirement 7: Navbar element -->
  <nav id="navbar">
    <!-- Requirement 8: Anchors with href attributes starting with # -->
    <a href="#welcome-section">About</a>
    <a href="#project-section">Work</a>
  </nav>

  <!-- Requirement 1: Welcome section -->
  <section id="welcome-section">
    <!-- Requirement 2 & 3: Non-empty h1 element -->
    <h1>Hey, I am a Web Developer</h1>
    <p>Welcome to my portfolio</p>
  </section>

  <!-- Requirement 4: Projects section -->
  <section id="project-section">
    <h2>Here is some of my work</h2>
    
    <div class="projects-grid">
      <!-- Requirement 5 & 6: Project tile containing an 'a' element -->
      <a href="https://example.com" class="project-tile" target="_blank">
        <h3>Technical Documentation Page</h3>
      </a>
      <a href="https://example.com" class="project-tile" target="_blank">
        <h3>Tribute Page</h3>
      </a>
    </div>
  </section>

  <section id="profile-link-section">
    <!-- Requirement 9 & 10: Profile link anchor with target="_blank" -->
    <a id="profile-link" href="https://github.com" target="_blank">View my GitHub Profile</a>
  </section>

</body>
</html>
